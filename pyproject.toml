[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-profile-lab"
version = "0.1.0"
description = "Local experiment, benchmarking, and tuning environment for llama.cpp profiles."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "civcode" }
]
dependencies = [
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
llprof = "llama_profile_lab.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["llama_profile_lab"]
mypy_path = "src"
